name: ScanToSim
options:
  bundleIdPrefix: com.azersky
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: JC3W536XWY
    CODE_SIGN_STYLE: Automatic
targets:
  ScanToSim:
    type: application
    platform: iOS
    sources: [ScanToSim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azersky.ScanToSim
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ScanToSim/Info.plist
      properties:
        CFBundleDisplayName: Scan2Sim
        NSCameraUsageDescription: Scan2Sim uses the camera and LiDAR to build a 3D model of the area you scan.
        UIRequiredDeviceCapabilities: [arkit]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
